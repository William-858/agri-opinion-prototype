<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業綠能輿情 · 週輿情彙整</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#f5f1e8;--paper:#fbf8f1;
    --ink:#1f1d18;--ink-soft:#4a463d;--ink-faint:#7d7869;
    --rule:#d8d1bf;--rule-soft:#e8e2d2;
    --accent:#4a5d3a;--accent-soft:#6e8557;--accent-bg:#e8ede0;
    --warn:#8a5a1a;--warn-bg:#f3e7cf;
    --neg:#7a2e2e;--neg-bg:#f1e1de;
    --serif:"Noto Serif TC",serif;
    --sans:"Noto Sans TC",system-ui,sans-serif;
    --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .nav-bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 32px;display:flex;align-items:center;gap:18px;font-size:13px;position:sticky;top:0;z-index:40}
  .nav-brand{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink)}
  .nav-sep{color:var(--ink-faint)}
  .nav-link{color:var(--ink-soft);text-decoration:none;font-weight:500;border:1px solid var(--rule);padding:4px 12px;border-radius:3px}
  .nav-link:hover{background:var(--accent-bg);border-color:var(--accent-soft);color:var(--accent)}
  .nav-spacer{flex:1}

  .page{max-width:820px;margin:0 auto;padding:32px 32px 80px}
  .page-header{margin-bottom:28px}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px}
  h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 6px}
  .subhead{font-size:13px;color:var(--ink-soft)}

  .section{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:20px;overflow:hidden}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
  .section-icon{font-size:16px;width:24px;text-align:center}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:500;flex:1}
  .section-body{padding:20px}

  .range-display{font-family:var(--mono);font-size:14px;background:var(--rule-soft);padding:10px 14px;border-radius:4px;display:inline-block}
  .toggle-custom{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-left:12px;font-family:var(--sans)}
  .custom-row{display:none;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .custom-row.open{display:flex}
  .custom-row label{font-size:12px;color:var(--ink-faint)}
  .custom-row input[type=date]{padding:7px 10px;border:1px solid var(--rule);border-radius:3px;font-family:var(--sans);font-size:13px;background:var(--paper);color:var(--ink)}

  .btn{font-family:var(--sans);font-size:13px;padding:9px 20px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:500}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .btn-primary:hover{background:#3a4a2e;border-color:#3a4a2e}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

  .result-empty{text-align:center;padding:32px 20px;color:var(--ink-faint);font-style:italic;font-size:14px}
  .result-summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
  .stat-card{background:var(--rule-soft);border-radius:4px;padding:14px 18px}
  .stat-val{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1;color:var(--ink)}
  .stat-key{font-size:11px;color:var(--ink-faint);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

  table.stats-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
  table.stats-table th,table.stats-table td{border:1px solid var(--rule);padding:7px 10px;text-align:left}
  table.stats-table th{background:var(--rule-soft);font-weight:500}

  .doc-link-box{background:var(--accent-bg);border:1px solid var(--accent-soft);border-radius:4px;padding:14px 16px;margin-bottom:16px;font-size:13px}
  .doc-link-box a{color:var(--accent);font-weight:500}
  .doc-hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.6}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:250;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.error{background:var(--neg)}
  .toast.ok{background:var(--accent)}
  .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(245,241,232,.85);display:none;align-items:center;justify-content:center;z-index:200}
  .loading-overlay.show{display:flex}
  .loading-box{background:var(--paper);border:1px solid var(--rule);padding:32px 40px;border-radius:6px;text-align:center;max-width:360px}
  .spinner{width:32px;height:32px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:var(--serif);font-size:15px;margin-bottom:6px}

  @media(max-width:640px){
    .page{padding:20px 16px 60px}
    .nav-bar{padding:10px 16px}
  }
</style>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-api.js"></script>
</head>
<body>

<div class="nav-bar">
  <span class="nav-brand">農業綠能輿情系統</span>
  <span class="nav-sep">/</span>
  <span style="color:var(--ink)">週輿情彙整</span>
  <div class="nav-spacer"></div>
  <a class="nav-link" href="index.html" target="_top">→ 候選新聞頁</a>
</div>

<div class="page">
  <div class="page-header">
    <div class="eyebrow">公共治理與制度創新研究所</div>
    <h1>週輿情彙整</h1>
    <div class="subhead">彙整輿情主表最近一週資料（排除「其他」型態），產出週輿情報告 Google 文件，可編輯後再寄送。</div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon">🗓</div>
      <div class="section-title">彙整區間</div>
    </div>
    <div class="section-body">
      <span class="range-display" id="range-display">載入中…</span>
      <button class="toggle-custom" id="toggle-custom" onclick="toggleCustomRange()">自訂區間</button>

      <div class="custom-row" id="custom-row">
        <label>起：<input type="date" id="custom-start"></label>
        <label>迄：<input type="date" id="custom-end"></label>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btn-generate" onclick="generateReport()">產生週輿情</button>
      </div>
    </div>
  </div>

  <div class="section" id="result-section" style="display:none;">
    <div class="section-header">
      <div class="section-icon">📄</div>
      <div class="section-title">產出結果</div>
    </div>
    <div class="section-body" id="result-body">
      <!-- 動態填入 -->
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">處理中…</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var lastDocId = null;

document.addEventListener('DOMContentLoaded', function () {
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.label) {
        document.getElementById('range-display').textContent = r.label;
        document.getElementById('custom-start').value = r.startDate;
        document.getElementById('custom-end').value = r.endDate;
      } else {
        document.getElementById('range-display').textContent = '無法取得預設區間';
      }
    })
    .withFailureHandler(function (err) {
      document.getElementById('range-display').textContent = '載入失敗：' + err.message;
    })
    .triggerGetWeeklyDefaultRange();
});

function toggleCustomRange() {
  document.getElementById('custom-row').classList.toggle('open');
}

function generateReport() {
  var customOpen = document.getElementById('custom-row').classList.contains('open');
  var opts = {};
  if (customOpen) {
    var s = document.getElementById('custom-start').value;
    var e = document.getElementById('custom-end').value;
    if (!s || !e) { toast('請選擇完整的起訖日期', true); return; }
    opts.startDate = s;
    opts.endDate = e;
  }

  document.getElementById('btn-generate').disabled = true;
  showLoading('產生週輿情中，這可能需要一點時間…');

  google.script.run
    .withSuccessHandler(function (r) {
      hideLoading();
      document.getElementById('btn-generate').disabled = false;
      if (!r) { toast('產生失敗：無回應', true); return; }
      if (r.success === false) { toast('產生失敗：' + r.message, true); return; }
      renderResult(r);
    })
    .withFailureHandler(function (err) {
      hideLoading();
      document.getElementById('btn-generate').disabled = false;
      toast('產生失敗：' + err.message, true);
    })
    .triggerGenerateWeeklyReport(opts);
}

function renderResult(r) {
  var section = document.getElementById('result-section');
  var body = document.getElementById('result-body');
  section.style.display = 'block';

  if (r.empty) {
    lastDocId = null;
    body.innerHTML = '<div class="result-empty">' + escapeHtml(r.message || '本週無輿情') +
      '（' + escapeHtml(r.weekLabel || '') + '）</div>';
    return;
  }

  lastDocId = r.docId;

  var statsRows = (r.statsPreview || []).map(function (s) {
    return '<tr><td>' + escapeHtml(s.type) + '</td><td>' + s.count + ' 則</td></tr>';
  }).join('');

  body.innerHTML =
    '<div class="result-summary">' +
      '<div class="stat-card"><div class="stat-val">' + r.total + '</div><div class="stat-key">總則數</div></div>' +
      '<div class="stat-card"><div class="stat-val" style="font-size:16px;">' + escapeHtml(r.weekLabel) + '</div><div class="stat-key">週區段</div></div>' +
    '</div>' +
    '<table class="stats-table"><thead><tr><th>綠能型態</th><th>則數</th></tr></thead><tbody>' + statsRows + '</tbody></table>' +
    '<div class="doc-link-box">' +
      '📄 <a href="' + escapeAttr(r.docUrl) + '" target="_blank">在 Google 文件中開啟／編輯草稿</a>' +
      '<div class="doc-hint">可直接編輯內文、圖表、附表，按下方「寄送」時會以文件目前內容寄出。</div>' +
    '</div>' +
    '<div class="btn-row"><button class="btn btn-primary" onclick="sendReport()">寄送週輿情</button></div>';
}

function sendReport() {
  if (!lastDocId) { toast('尚未產生週輿情文件', true); return; }
  showLoading('寄送中…');
  google.script.run
    .withSuccessHandler(function (r) {
      hideLoading();
      if (!r || r.success === false) { toast('寄送失敗：' + (r ? r.message : '無回應'), true); return; }
      toast('已寄送（收件人 ' + r.to + '／副本 ' + r.cc + '／密件 ' + r.bcc + '）', false, true);
    })
    .withFailureHandler(function (err) {
      hideLoading();
      toast('寄送失敗：' + err.message, true);
    })
    .triggerSendWeeklyReport(lastDocId);
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;');
}

function showLoading(text) {
  document.getElementById('loading-text').textContent = text || '處理中…';
  document.getElementById('loading').classList.add('show');
}
function hideLoading() { document.getElementById('loading').classList.remove('show'); }

function toast(msg, isError, isOk) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : (isOk ? ' ok' : ''));
  setTimeout(function () { t.classList.remove('show'); }, 2600);
}
</script>
</body>
</html>
