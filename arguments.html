<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>論點排排看 · 回應稿工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<base target="_top">
<style>
  :root{
    --bg:#f5f1e8;--paper:#fbf8f1;
    --ink:#1f1d18;--ink-soft:#4a463d;--ink-faint:#7d7869;
    --rule:#d8d1bf;--rule-soft:#e8e2d2;
    --accent:#4a5d3a;--accent-soft:#6e8557;--accent-bg:#e8ede0;
    --warn:#8a5a1a;--warn-bg:#f3e7cf;
    --neg:#7a2e2e;--neg-bg:#f1e1de;
    --serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
  .nav-bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 24px;display:flex;align-items:center;gap:18px;font-size:13px;position:sticky;top:0;z-index:40}
  .nav-bar a{color:var(--ink-soft);text-decoration:none;font-weight:500;border:1px solid var(--rule);padding:4px 12px;border-radius:3px}
  .nav-bar a:hover{background:var(--accent-bg);border-color:var(--accent-soft);color:var(--accent)}
  .nav-brand{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);border:none!important;padding:0!important}
  .nav-sep{color:var(--ink-faint)}
  .nav-spacer{flex:1}
  .kb-status{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

  .container{max-width:840px;margin:0 auto;padding:36px 24px 100px}
  header{margin-bottom:28px}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px}
  h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 6px}
  .lead{font-size:13px;color:var(--ink-soft);margin:0}

  .section{margin-bottom:28px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .section-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--accent);color:var(--paper);border-radius:50%;font-family:var(--mono);font-size:11px;flex-shrink:0}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:500;margin:0}
  .section-sub{font-size:12px;color:var(--ink-faint)}

  .panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
  .input-tabs{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;width:fit-content;margin-bottom:14px}
  .input-tabs button{background:var(--paper);border:none;padding:7px 16px;font-size:12px;cursor:pointer;color:var(--ink-soft);border-right:1px solid var(--rule);font-family:var(--sans)}
  .input-tabs button:last-child{border-right:none}
  .input-tabs button.active{background:var(--ink);color:var(--paper)}
  .input-pane{display:none}
  .input-pane.active{display:block}
  input[type=text],input[type=url],textarea{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;font-family:var(--sans);font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:10px;outline:none}
  textarea{resize:vertical;min-height:120px;line-height:1.6}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .url-row{display:flex;gap:8px;align-items:flex-start}
  .url-row input{flex:1}
  .field-label{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}

  .btn{font-family:var(--sans);font-size:13px;padding:8px 16px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .btn-primary:hover{background:#3a4a2e}
  .btn-sm{padding:5px 12px;font-size:12px}
  .btn-opus{color:var(--warn);border-color:var(--warn)}
  .btn-opus:hover{background:var(--warn);color:var(--paper)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .analysis-empty{background:var(--paper);border:1px dashed var(--rule);border-radius:6px;padding:36px 20px;text-align:center;color:var(--ink-faint);font-size:13px;font-style:italic}

  .arg-card{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--neg);border-radius:4px;padding:16px 18px;margin-bottom:12px}
  .arg-issue{font-family:var(--serif);font-size:14px;color:var(--ink);margin-bottom:10px;line-height:1.6}
  .arg-issue::before{content:'質疑 ';font-size:10px;color:var(--neg);background:var(--neg-bg);padding:2px 6px;border-radius:2px;margin-right:8px;font-family:var(--sans)}
  .matched-label{font-size:11px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 6px;padding-top:8px;border-top:1px dashed var(--rule)}
  .matched-point{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--accent-bg);border-radius:3px;margin-bottom:6px;cursor:pointer}
  .matched-point:hover{background:#d8e0ce}
  .matched-point.added{opacity:.5;pointer-events:none}
  .mp-id{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:500;background:var(--paper);padding:2px 6px;border-radius:2px;flex-shrink:0;margin-top:1px}
  .mp-main{flex:1;min-width:0}
  .mp-title{flex:1;font-size:13px;cursor:pointer;user-select:none}
  .mp-title:hover{color:var(--accent)}
  .mp-caret{font-size:9px;color:var(--ink-faint)}
  .mp-body{font-size:12px;color:var(--ink-soft);line-height:1.7;margin-top:6px;padding:8px 10px;background:var(--paper);border-radius:3px;white-space:pre-wrap}
  .mp-source{font-size:11px;color:var(--ink-faint);font-style:italic;margin-top:6px}
  .mp-add{background:var(--accent);color:var(--paper);border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;flex-shrink:0;line-height:1;margin-top:1px}
  .need-new{background:var(--warn-bg);border:1px solid #d4b988;border-radius:3px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--warn)}
  .draft-point-btn{margin-top:8px}

  /* 新擬論點卡 */
  .new-point-card{background:#fff;border:1px dashed var(--accent-soft);border-radius:4px;padding:14px 16px;margin-top:10px}
  .new-point-card input,.new-point-card textarea{margin-bottom:8px;font-size:13px}
  .new-point-card textarea{min-height:80px}
  .np-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* 組裝區 */
  .tray{background:var(--paper);border:1px dashed var(--rule);border-radius:6px;min-height:70px;padding:12px}
  .tray-empty{text-align:center;color:var(--ink-faint);font-size:12px;padding:24px 20px;font-style:italic}
  .tray-item{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:3px;padding:11px 14px;margin-bottom:8px}
  .tray-item-num{display:inline-block;background:var(--accent);color:var(--paper);font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;margin-right:8px}
  .tray-item-title{font-size:13px;font-weight:500}
  .tray-item-actions{display:inline-flex;gap:4px;margin-left:8px}
  .icon-btn{background:none;border:1px solid var(--rule);color:var(--ink-soft);width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .icon-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .icon-btn.danger:hover{background:var(--neg);border-color:var(--neg)}

  /* 體例 + 生成 */
  .style-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .style-select{padding:8px 12px;border:1px solid var(--rule);border-radius:3px;font-size:13px;background:var(--paper);font-family:var(--sans);min-width:200px}
  .style-hint{font-size:11px;color:var(--ink-faint);flex:1;min-width:200px}

  .draft-area{width:100%;min-height:240px;padding:16px 18px;border:1px solid var(--rule);border-radius:6px;font-family:var(--serif);font-size:13.5px;line-height:1.9;resize:vertical;outline:none;background:var(--paper);color:var(--ink)}
  .draft-area:focus{border-color:var(--accent)}
  .draft-area.loading{opacity:.6}
  .draft-meta{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:12px;color:var(--ink-faint)}
  .draft-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.error{background:var(--neg)}
  .toast.ok{background:var(--accent)}
  .loading-overlay{position:fixed;inset:0;background:rgba(245,241,232,.85);display:none;align-items:center;justify-content:center;z-index:200}
  .loading-overlay.show{display:flex}
  .loading-box{background:var(--paper);border:1px solid var(--rule);padding:32px 40px;border-radius:6px;text-align:center;max-width:360px}
  .spinner{width:32px;height:32px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:var(--serif);font-size:15px;margin-bottom:6px}
  .loading-sub{font-size:12px;color:var(--ink-faint)}

  @media(max-width:640px){
    .container{padding:24px 16px 80px}
    .url-row{flex-direction:column}
    .url-row .btn{width:100%}
  }
</style>
</head>
<body>

<div class="nav-bar">
  <span class="nav-brand">農業綠能輿情系統</span>
  <span class="nav-sep">/</span>
  <span style="color:var(--ink)">論點排排看</span>
  <div class="nav-spacer"></div>
  <a href="?key=<?= encodeURIComponent(password) ?>&page=candidates">← 候選新聞</a>
  <span class="kb-status" id="kb-status">—</span>
</div>

<div class="container">
  <header>
    <div class="eyebrow">回應稿工作台</div>
    <h1>論點排排看</h1>
    <p class="lead">貼新聞連結或標題＋內文 → AI 分析質疑點、比對知識庫論點、缺的現場擬 → 選體例組裝成回應稿。</p>
  </header>

  <!-- 1 輸入 -->
  <div class="section">
    <div class="section-head"><span class="section-num">1</span><h2 class="section-title">輸入新聞</h2></div>
    <div class="panel">
      <div class="input-tabs">
        <button class="active" data-pane="paste">貼標題＋內文</button>
        <button data-pane="url">貼連結（嘗試抓取）</button>
      </div>

      <div class="input-pane active" id="pane-paste">
        <label class="field-label">新聞標題</label>
        <input type="text" id="news-title" placeholder="新聞標題">
        <label class="field-label">新聞內文／摘要</label>
        <textarea id="news-body" placeholder="貼上新聞內文或摘要，越完整 AI 分析越準"></textarea>
      </div>

      <div class="input-pane" id="pane-url">
        <label class="field-label">新聞連結</label>
        <div class="url-row">
          <input type="url" id="news-url" placeholder="https://...">
          <button class="btn" id="btn-fetch-url">抓取內文</button>
        </div>
        <div class="section-sub" style="margin-bottom:10px">抓取為盡力而為：部分網站擋爬蟲或用 JS 渲染會失敗，失敗時請改用左邊分頁手動貼上。抓到的內文會自動填入並可編輯。</div>
      </div>

      <div class="btn-row" style="margin-top:6px">
        <button class="btn btn-primary" id="btn-analyze">分析論點</button>
        <button class="btn btn-sm" id="btn-load-sample">載入範例</button>
      </div>
    </div>
  </div>

  <!-- 2 質疑點與論點 -->
  <div class="section">
    <div class="section-head"><span class="section-num">2</span><h2 class="section-title">質疑點與建議論點</h2><span class="section-sub" id="analysis-meta"></span></div>
    <div id="analysis-area"><div class="analysis-empty">尚未分析。輸入新聞後按「分析論點」。</div></div>
  </div>

  <!-- 3 組裝區 -->
  <div class="section">
    <div class="section-head"><span class="section-num">3</span><h2 class="section-title">組裝區</h2><span class="section-sub">點上方論點加入，可排序</span></div>
    <div class="tray" id="tray"><div class="tray-empty" id="tray-empty">從上方點 + 加入論點</div></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn btn-sm" id="btn-clear-tray">清空</button></div>
  </div>

  <!-- 4 體例 + 生成 -->
  <div class="section">
    <div class="section-head"><span class="section-num">4</span><h2 class="section-title">選體例、生成回應稿</h2></div>
    <div class="panel">
      <div class="style-row">
        <label class="field-label" style="margin:0">體例</label>
        <select class="style-select" id="style-select"></select>
        <span class="style-hint" id="style-hint"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-generate">依體例生成</button>
        <button class="btn btn-opus" id="btn-generate-opus">召喚 Opus 生成</button>
      </div>
    </div>

    <div class="draft-meta" id="draft-meta" style="display:none">
      <span id="draft-model-tag"></span>
      <span id="draft-wordcount"></span>
    </div>
    <textarea class="draft-area" id="draft-area" placeholder="生成的回應稿會顯示在此，可直接編輯…" style="margin-top:12px"></textarea>
    <div class="draft-actions">
      <button class="btn" id="btn-copy-draft">複製全文</button>
      <button class="btn" id="btn-download-draft">下載 .txt</button>
      <button class="btn btn-primary" id="btn-save-draft">存為建議回應</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">處理中…</div>
    <div class="loading-sub" id="loading-sub"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PASSWORD  = <?= JSON.stringify(password) ?>;
const STYLES    = <?!= styles ?>;
const INIT_TITLE = <?= JSON.stringify(newsTitle) ?>;
const INIT_BODY  = <?= JSON.stringify(newsBody) ?>;

let analysis = [];   // [{issue, matched:[{id,title,body,source}], needNew, newPoint}]
let tray = [];       // [{id,title,body,source}]
let kbPoints = [];   // 由 analyze 回傳的 matched 解析（這裡簡化：matched 只有 id，title 由後端補不易，採顯示 id + AI 提供）

// ── 初始化體例下拉 ──
function populateStyles() {
  const sel = document.getElementById('style-select');
  sel.innerHTML = '';
  if (!STYLES || STYLES.length === 0) {
    const o = document.createElement('option');
    o.value = ''; o.textContent = '（尚無體例，請在主控台新增）';
    sel.appendChild(o);
    return;
  }
  STYLES.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = s.name;
    sel.appendChild(o);
  });
  updateStyleHint();
}
function updateStyleHint() {
  const sel = document.getElementById('style-select');
  const idx = parseInt(sel.value);
  const s = STYLES[idx];
  document.getElementById('style-hint').textContent = s ? (s.guide || '').slice(0, 80) + ((s.guide||'').length > 80 ? '…' : '') : '';
}
document.getElementById('style-select').addEventListener('change', updateStyleHint);

// ── 輸入分頁切換 ──
document.querySelectorAll('.input-tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.input-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.input-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('pane-' + b.dataset.pane).classList.add('active');
  });
});

// ── 抓取內文 ──
document.getElementById('btn-fetch-url').addEventListener('click', () => {
  const url = document.getElementById('news-url').value.trim();
  if (!url) { toast('請貼上連結', true); return; }
  showLoading('抓取內文中', '盡力而為，失敗請改手動貼上…');
  google.script.run
    .withSuccessHandler(r => {
      hideLoading();
      if (r.success) {
        if (r.title) document.getElementById('news-title').value = r.title;
        document.getElementById('news-body').value = r.content;
        // 切回貼上分頁顯示結果
        document.querySelector('.input-tabs button[data-pane="paste"]').click();
        toast('已抓取內文，請確認後分析', false, true);
      } else {
        toast(r.message || '抓取失敗', true);
      }
    })
    .withFailureHandler(err => { hideLoading(); toast('失敗：' + err.message, true); })
    .triggerFetchArticle(url);
});

// ── 分析論點 ──
document.getElementById('btn-analyze').addEventListener('click', () => {
  const title = document.getElementById('news-title').value.trim();
  const body  = document.getElementById('news-body').value.trim();
  if (!title && !body) { toast('請輸入標題或內文', true); return; }
  showLoading('AI 分析論點中', '抽取質疑點、比對知識庫…');
  google.script.run
    .withSuccessHandler(r => {
      hideLoading();
      if (r.success) {
        analysis = (r.arguments || []).map(a => ({ ...a, newPoint: null }));
        renderAnalysis();
        const total = analysis.length;
        const need  = analysis.filter(a => a.needNew).length;
        document.getElementById('analysis-meta').textContent = total + ' 質疑點 · ' + need + ' 需新擬';
      } else {
        toast(r.message || '分析失敗', true);
      }
    })
    .withFailureHandler(err => { hideLoading(); toast('失敗：' + err.message, true); })
    .triggerAnalyzeArguments({ newsTitle: title, newsBody: body });
});

function renderAnalysis() {
  const area = document.getElementById('analysis-area');
  if (analysis.length === 0) {
    area.innerHTML = '<div class="analysis-empty">未抽取到質疑點，請貼更完整內文。</div>';
    return;
  }
  area.innerHTML = '';
  analysis.forEach((arg, ai) => {
    const card = document.createElement('div');
    card.className = 'arg-card';

    let matchedHtml = '';
    if (arg.matched && arg.matched.length > 0) {
      matchedHtml = '<div class="matched-label">知識庫對應論點（點標題展開內容，確認後按右側 ＋ 加入）</div>' +
        arg.matched.map((mp, mi) => {
          const inTray = tray.find(t => t.id === mp.id);
          return `<div class="matched-point${inTray ? ' added' : ''}" data-ai="${ai}" data-mi="${mi}">
            <span class="mp-id">${escapeHtml(mp.id)}</span>
            <div class="mp-main">
              <div class="mp-title" data-toggle="${ai}-${mi}">${escapeHtml(mp.title)} <span class="mp-caret">▾</span></div>
              <div class="mp-body" id="mpbody-${ai}-${mi}" style="display:none">${escapeHtml(mp.body || '（此論點無內文）')}${mp.source ? '<div class="mp-source">依據：' + escapeHtml(mp.source) + '</div>' : ''}</div>
            </div>
            <button class="mp-add" data-add="${ai}-${mi}">+</button>
          </div>`;
        }).join('');
    }

    let needHtml = '';
    if (arg.needNew && !arg.newPoint) {
      needHtml = `<div class="need-new">知識庫無對應論點
        <button class="btn btn-sm draft-point-btn" data-action="draft-point" data-ai="${ai}">AI 擬一條新論點</button>
      </div>`;
    }

    let newPointHtml = '';
    if (arg.newPoint) {
      const np = arg.newPoint;
      newPointHtml = `<div class="new-point-card" data-ai="${ai}">
        <label class="field-label">新論點標題</label>
        <input type="text" class="np-title" value="${escapeAttr(np.title || '')}">
        <label class="field-label">論點正文</label>
        <textarea class="np-body">${escapeHtml(np.body || '')}</textarea>
        <label class="field-label">依據</label>
        <input type="text" class="np-source" value="${escapeAttr(np.source || '')}">
        <div class="np-actions">
          <button class="btn btn-sm" data-action="add-to-tray" data-ai="${ai}">加入組裝區</button>
          <button class="btn btn-sm btn-primary" data-action="add-to-kb" data-ai="${ai}">加入論點庫</button>
          <button class="btn btn-sm" data-action="redraft-point" data-ai="${ai}">重擬</button>
        </div>
      </div>`;
    }

    card.innerHTML = `<div class="arg-issue">${escapeHtml(arg.issue)}</div>${matchedHtml}${needHtml}${newPointHtml}`;
    area.appendChild(card);
  });
  attachAnalysisListeners();
}

function attachAnalysisListeners() {
  // 展開/收合論點內容
  document.querySelectorAll('.mp-title[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const key  = el.dataset.toggle;
      const body = document.getElementById('mpbody-' + key);
      if (!body) return;
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      const caret = el.querySelector('.mp-caret');
      if (caret) caret.textContent = open ? '▴' : '▾';
    });
  });
  // 加入既有論點（帶完整內容）
  document.querySelectorAll('.mp-add[data-add]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const parts = btn.dataset.add.split('-');
      const ai = parseInt(parts[0]), mi = parseInt(parts[1]);
      const mp = analysis[ai].matched[mi];
      if (!mp) return;
      addToTray({ id: mp.id, title: mp.title, body: mp.body, source: mp.source });
    });
  });
  // AI 擬新論點
  document.querySelectorAll('[data-action="draft-point"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ai = parseInt(btn.dataset.ai);
      draftPoint(ai, btn);
    });
  });
  document.querySelectorAll('[data-action="redraft-point"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ai = parseInt(btn.dataset.ai);
      analysis[ai].newPoint = null;
      draftPoint(ai, btn);
    });
  });
  // 新論點欄位編輯同步
  document.querySelectorAll('.new-point-card').forEach(card => {
    const ai = parseInt(card.dataset.ai);
    card.querySelector('.np-title').addEventListener('input', e => analysis[ai].newPoint.title = e.target.value);
    card.querySelector('.np-body').addEventListener('input', e => analysis[ai].newPoint.body = e.target.value);
    card.querySelector('.np-source').addEventListener('input', e => analysis[ai].newPoint.source = e.target.value);
  });
  // 新論點加入組裝區
  document.querySelectorAll('[data-action="add-to-tray"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ai = parseInt(btn.dataset.ai);
      const np = analysis[ai].newPoint;
      if (!np) return;
      addToTray({ id: '自擬', title: np.title, body: np.body, source: np.source });
    });
  });
  // 新論點加入論點庫
  document.querySelectorAll('[data-action="add-to-kb"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ai = parseInt(btn.dataset.ai);
      const np = analysis[ai].newPoint;
      if (!np || !np.title) { toast('論點標題不可空', true); return; }
      btn.disabled = true; btn.textContent = '寫入中…';
      google.script.run
        .withSuccessHandler(r => {
          btn.disabled = false; btn.textContent = '加入論點庫';
          if (r.success) {
            toast('已加入論點庫（編號 ' + r.pid + '），待主控台歸位', false, true);
            np.id = r.pid;
          } else toast(r.message || '失敗', true);
        })
        .withFailureHandler(err => { btn.disabled = false; btn.textContent = '加入論點庫'; toast('失敗：' + err.message, true); })
        .triggerAddPointToKB({ title: np.title, body: np.body, source: np.source, issue: analysis[ai].issue });
    });
  });
}

function draftPoint(ai, btn) {
  const title = document.getElementById('news-title').value.trim();
  const body  = document.getElementById('news-body').value.trim();
  if (btn) { btn.disabled = true; btn.textContent = '擬稿中…'; }
  google.script.run
    .withSuccessHandler(r => {
      if (r.success) {
        analysis[ai].newPoint = { title: r.title, body: r.body, source: r.source };
        renderAnalysis();
      } else {
        if (btn) { btn.disabled = false; btn.textContent = 'AI 擬一條新論點'; }
        toast(r.message || '擬稿失敗', true);
      }
    })
    .withFailureHandler(err => {
      if (btn) { btn.disabled = false; btn.textContent = 'AI 擬一條新論點'; }
      toast('失敗：' + err.message, true);
    })
    .triggerDraftNewPoint({ issue: analysis[ai].issue, newsTitle: title, newsBody: body });
}

// ── 組裝區 ──
function addToTray(p) {
  if (tray.find(t => t.id === p.id && p.id !== '自擬')) { toast('此論點已加入', true); return; }
  tray.push(p);
  renderTray();
  renderAnalysis();
}
function renderTray() {
  const t = document.getElementById('tray');
  const empty = document.getElementById('tray-empty');
  Array.from(t.querySelectorAll('.tray-item')).forEach(x => x.remove());
  empty.style.display = tray.length === 0 ? 'block' : 'none';
  tray.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'tray-item';
    item.innerHTML = `
      <span class="tray-item-num">${idx + 1}</span>
      <span class="tray-item-title">${escapeHtml(p.id === '自擬' ? p.title : p.title)}</span>
      <span class="tray-item-actions">
        <button class="icon-btn" data-act="up"   ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button class="icon-btn" data-act="down" ${idx === tray.length-1 ? 'disabled' : ''}>↓</button>
        <button class="icon-btn danger" data-act="rm">×</button>
      </span>`;
    item.querySelector('[data-act="up"]').addEventListener('click', () => { [tray[idx-1],tray[idx]]=[tray[idx],tray[idx-1]]; renderTray(); });
    item.querySelector('[data-act="down"]').addEventListener('click', () => { [tray[idx+1],tray[idx]]=[tray[idx],tray[idx+1]]; renderTray(); });
    item.querySelector('[data-act="rm"]').addEventListener('click', () => { tray.splice(idx,1); renderTray(); renderAnalysis(); });
    t.appendChild(item);
  });
}
document.getElementById('btn-clear-tray').addEventListener('click', () => {
  if (tray.length === 0) return;
  if (confirm('確定清空組裝區？')) { tray = []; renderTray(); renderAnalysis(); }
});

// ── 生成回應稿 ──
function doGenerate(useOpus) {
  const sel = document.getElementById('style-select');
  const idx = parseInt(sel.value);
  const style = STYLES[idx];
  if (!style) { toast('請先在主控台新增體例', true); return; }
  const title = document.getElementById('news-title').value.trim();
  const body  = document.getElementById('news-body').value.trim();
  if (useOpus && !confirm('Opus 品質更高、費用約 Sonnet 5 倍，確定？')) return;

  const ta = document.getElementById('draft-area');
  ta.classList.add('loading');
  ta.value = '生成中…';
  showLoading((useOpus ? 'Opus' : 'Sonnet') + ' 生成中', '依體例「' + style.name + '」組裝…');

  google.script.run
    .withSuccessHandler(r => {
      hideLoading();
      ta.classList.remove('loading');
      if (r.success) {
        ta.value = r.draft || '';
        document.getElementById('draft-meta').style.display = 'flex';
        document.getElementById('draft-model-tag').textContent = '模型：' + (r.model || '');
        updateWordCount();
        toast('已生成', false, true);
      } else {
        ta.value = '生成失敗：' + (r.message || '');
        toast('生成失敗', true);
      }
    })
    .withFailureHandler(err => { hideLoading(); ta.classList.remove('loading'); ta.value = '失敗：' + err.message; toast('失敗：' + err.message, true); })
    .triggerGenerateByStyle({
      newsTitle: title, newsBody: body,
      points: tray, styleName: style.name, styleGuide: style.guide, useOpus: useOpus
    });
}
document.getElementById('btn-generate').addEventListener('click', () => doGenerate(false));
document.getElementById('btn-generate-opus').addEventListener('click', () => doGenerate(true));

document.getElementById('draft-area').addEventListener('input', updateWordCount);
function updateWordCount() {
  const len = document.getElementById('draft-area').value.replace(/\s/g, '').length;
  document.getElementById('draft-wordcount').textContent = len + ' 字';
}

// ── 草稿動作 ──
document.getElementById('btn-copy-draft').addEventListener('click', async () => {
  const txt = document.getElementById('draft-area').value;
  if (!txt) { toast('稿件為空', true); return; }
  try { await navigator.clipboard.writeText(txt); toast('已複製'); }
  catch { toast('複製失敗', true); }
});
document.getElementById('btn-download-draft').addEventListener('click', () => {
  const txt = document.getElementById('draft-area').value;
  if (!txt) { toast('稿件為空', true); return; }
  const title = document.getElementById('news-title').value.trim();
  const header = title ? '【回應稿】' + title + '\n' + new Date().toLocaleString('zh-Hant') + '\n' + '='.repeat(40) + '\n\n' : '';
  const blob = new Blob(['\uFEFF' + header + txt], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '回應稿_' + new Date().toISOString().slice(0,10) + '.txt';
  link.click();
  toast('已下載');
});
document.getElementById('btn-save-draft').addEventListener('click', () => {
  const txt = document.getElementById('draft-area').value;
  const title = document.getElementById('news-title').value.trim();
  if (!txt) { toast('稿件為空', true); return; }
  if (!title) { toast('請填新聞標題（存檔需要）', true); return; }
  const btn = document.getElementById('btn-save-draft');
  btn.disabled = true; btn.textContent = '存入中…';
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.textContent = '存為建議回應';
      if (r.success) toast('已存為建議回應，並寫入知識庫_待整合', false, true);
      else toast(r.message || '失敗', true);
    })
    .withFailureHandler(err => { btn.disabled = false; btn.textContent = '存為建議回應'; toast('失敗：' + err.message, true); })
    .triggerSaveArgumentDraft({ newsTitle: title, newsBody: document.getElementById('news-body').value, draftText: txt });
});

  document.getElementById('news-title').value = '漁電共生淪光電廢墟 沒魚也沒錢民怒轟世紀騙局';
  document.getElementById('news-body').value = '漁電共生政策推動5年，民團指出大量案場僅有電無魚，養殖事實淪為口號。審計部報告也指出查核近7成有電無魚，引發養殖戶與光電業者對立。地方人士批評政府監管不力，要求停止核發新案。';
  toast('已載入範例');
});

// ── 工具 ──
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showLoading(t,s){document.getElementById('loading-text').textContent=t;document.getElementById('loading-sub').textContent=s||'';document.getElementById('loading').classList.add('show');}
function hideLoading(){document.getElementById('loading').classList.remove('show');}
function toast(msg,isErr,isOk){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isErr?' error':(isOk?' ok':''));setTimeout(()=>t.classList.remove('show'),2400);}

// ── 啟動 ──
document.getElementById('kb-status').textContent = (STYLES ? STYLES.length : 0) + ' 體例';
populateStyles();
renderTray();
if (INIT_TITLE) document.getElementById('news-title').value = INIT_TITLE;
if (INIT_BODY)  document.getElementById('news-body').value  = INIT_BODY;
// 不自動分析：即使從候選頁帶入新聞，也由使用者自行按「分析論點」，避免浪費 API

</script>
