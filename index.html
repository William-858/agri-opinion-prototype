<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業綠能輿情每日確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#f5f1e8;--paper:#fbf8f1;
    --ink:#1f1d18;--ink-soft:#4a463d;--ink-faint:#7d7869;
    --rule:#d8d1bf;--rule-soft:#e8e2d2;
    --accent:#4a5d3a;--accent-soft:#6e8557;--accent-bg:#e8ede0;
    --warn:#8a5a1a;--warn-bg:#f3e7cf;
    --neg:#7a2e2e;--neg-bg:#f1e1de;
    --pos:#3e6b3a;--pos-bg:#e3ecdf;
    --neu:#6b6555;--neu-bg:#ece6d3;
    --serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .page{max-width:980px;margin:0 auto;padding:32px 32px 140px}

  header{border-bottom:1px solid var(--rule);padding-bottom:24px;margin-bottom:28px}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px}
  h1{font-family:var(--serif);font-size:30px;font-weight:500;margin:0 0 4px}
  .subhead{font-size:13px;color:var(--ink-soft);margin-bottom:16px}

  .status-bar{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .status-info{display:flex;gap:18px;flex:1;flex-wrap:wrap}
  .status-item{font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
  .status-item strong{color:var(--ink);font-weight:500}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle}
  .status-dot.stale{background:var(--warn)}

  /* 抓取新聞按鈕組 */
  .fetch-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .refresh-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:6px 14px;border-radius:3px;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500}
  .refresh-btn:hover{background:var(--accent);color:var(--paper)}
  .refresh-btn:disabled{opacity:.5;cursor:wait}
  .custom-time-toggle{font-size:11px;color:var(--ink-faint);text-decoration:underline;background:none;border:none;cursor:pointer;font-family:var(--sans);padding:2px 6px}
  .custom-time-toggle:hover{color:var(--ink)}
  .custom-time-row{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 12px;background:var(--rule-soft);border-radius:4px;border:1px solid var(--rule)}
  .custom-time-row.open{display:flex}
  .custom-time-row label{font-size:11px;color:var(--ink-faint)}
  .custom-time-row input[type=datetime-local]{font-size:12px;padding:4px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-family:var(--sans)}
  .custom-time-row input:focus{outline:none;border-color:var(--accent)}

  .summary-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .stat{border-left:2px solid var(--rule);padding-left:12px}
  .stat-num{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1;color:var(--ink)}
  .stat-num.neg{color:var(--neg)}.stat-num.pos{color:var(--pos)}.stat-num.warn{color:var(--warn)}
  .stat-label{font-size:11px;color:var(--ink-faint);margin-top:4px}

  .filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
  .filter-label{font-size:12px;color:var(--ink-faint);margin-right:4px}
  .pill{font-size:13px;padding:5px 12px;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:999px;font-family:var(--sans)}
  .pill:hover{background:var(--accent-bg);border-color:var(--accent-soft)}
  .pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .filter-spacer{flex:1}
  .text-btn{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;background:none;border:none;cursor:pointer;font-family:var(--sans);padding:4px 8px}
  .text-btn:hover{color:var(--ink)}

  /* Card */
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:14px;padding:20px 24px;transition:all .15s ease}
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
  .card.is-negative{background:var(--neg-bg);border-color:#d4a3a3}
  .card.is-negative.selected{border-color:var(--neg);box-shadow:0 0 0 2px rgba(122,46,46,.12)}
  .card.suggest-skip{opacity:.65}
  .card.is-pending{background:var(--warn-bg);border-color:#d4b988}
  .card-top{display:grid;grid-template-columns:28px 1fr auto;gap:16px;align-items:flex-start}
  .check-wrap{padding-top:4px}
  .check{appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--paper)}
  .check:hover{border-color:var(--ink)}
  .check:checked{background:var(--accent);border-color:var(--accent)}
  .check:checked::after{content:'';position:absolute;left:5px;top:1px;width:6px;height:12px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .card-main h2{font-family:var(--serif);font-size:18px;font-weight:500;margin:0 0 8px;line-height:1.45}
  .card-main h2 a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .card-main h2 a:hover{border-bottom-color:var(--accent)}
  .meta{font-size:12px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);display:inline-block}
  .meta a{color:var(--ink-faint);text-decoration:none;border-bottom:1px dotted var(--ink-faint)}
  .meta a:hover{color:var(--accent)}

  .ai-suggest{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:3px;font-weight:500;white-space:nowrap}
  .ai-suggest::before{content:'◆';font-size:8px}
  .ai-attend{background:var(--accent-bg);color:var(--accent)}
  .ai-skip{background:var(--neu-bg);color:var(--neu)}
  .ai-critical{background:var(--neg-bg);color:var(--neg)}
  .ai-pending{background:var(--warn-bg);color:var(--warn)}
  .ai-note{margin-top:10px;padding:10px 14px;background:rgba(0,0,0,.025);border-left:2px solid var(--rule);font-size:13px;color:var(--ink-soft)}
  .ai-note .label{color:var(--ink-faint);font-size:11px;letter-spacing:.08em;margin-right:6px;text-transform:uppercase}

  .fields{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field-label{font-size:11px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
  .field select,.field input[type=text]{font-family:var(--sans);font-size:13px;padding:6px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);outline:none}
  .field select:focus,.field input:focus{border-color:var(--accent)}
  .score-group{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;width:fit-content}
  .score-btn{background:var(--paper);border:none;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);border-right:1px solid var(--rule)}
  .score-btn:last-child{border-right:none}
  .score-btn:hover{background:rgba(0,0,0,.03)}
  .score-btn.active-1{background:var(--neg);color:var(--paper)}
  .score-btn.active-2{background:var(--neu);color:var(--paper)}
  .score-btn.active-3{background:var(--pos);color:var(--paper)}

  .tags{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule)}
  .tags-label{font-size:11px;color:var(--ink-faint);margin-bottom:8px}
  .tag-list{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:4px 9px;border:1px solid var(--rule);background:transparent;color:var(--ink-faint);cursor:pointer;border-radius:3px;font-family:var(--sans)}
  .tag:hover{border-color:var(--accent-soft);color:var(--accent)}
  .tag.active{background:var(--accent);color:var(--paper);border-color:var(--accent)}
  .tag.ai-suggested:not(.active){border-color:var(--accent-soft);color:var(--accent);border-style:dashed}
  .loc-fields{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .loc-fields input{font-family:var(--sans);font-size:12px;padding:5px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);width:100%}

  .card-actions{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ref-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint);cursor:pointer;margin-left:auto;padding:4px 10px;border:1px solid var(--rule);border-radius:3px;user-select:none}
  .ref-toggle:hover{border-color:var(--ink-soft);color:var(--ink-soft)}
  .ref-check{width:14px;height:14px;cursor:pointer;accent-color:var(--ink)}
  .ref-check:checked + span{color:var(--ink);font-weight:500}
  .addtab-pane{padding:4px 0}
  .card-action-btn{font-size:11px;padding:5px 11px;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:3px;font-family:var(--sans)}
  .card-action-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .card-action-btn.neg{color:var(--neg);border-color:var(--neg)}
  .card-action-btn.neg:hover{background:var(--neg);color:var(--paper)}
  .card-action-btn:disabled{opacity:.5;cursor:wait}

  /* ── 回應稿工作區 ── */
  .response-workspace{margin-top:0;border-top:1px solid var(--rule);overflow:hidden;max-height:0;transition:max-height .35s ease,padding .35s ease;padding:0 0}
  .response-workspace.open{max-height:2000px;padding:20px 0 0}
  .ws-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .ws-title{font-family:var(--serif);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
  .ws-badge{font-size:10px;padding:2px 7px;background:var(--neg-bg);color:var(--neg);border-radius:2px;font-family:var(--mono);font-weight:500}
  .ws-close{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:20px;padding:0;line-height:1}
  .ws-close:hover{color:var(--ink)}
  .ws-body{display:grid;grid-template-columns:1fr 280px;gap:16px}
  .ws-draft{flex:1}
  .ws-draft textarea{width:100%;min-height:180px;padding:14px;border:1px solid var(--rule);border-radius:4px;font-family:var(--serif);font-size:13.5px;line-height:1.9;resize:vertical;outline:none;background:var(--paper);color:var(--ink)}
  .ws-draft textarea:focus{border-color:var(--accent)}
  .ws-draft textarea.loading{opacity:.6}
  .ws-side{font-size:12px}
  .ws-side-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .ws-issues{background:var(--neg-bg);border:1px solid #d4a3a3;border-radius:4px;padding:10px 12px;margin-bottom:10px}
  .ws-issue{font-size:12px;color:var(--neg);padding:2px 0;line-height:1.5}
  .ws-issue::before{content:'▸ ';font-size:10px}
  .ws-citations{background:var(--accent-bg);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
  .ws-cite{font-size:12px;color:var(--accent);padding:3px 0;line-height:1.5}
  .ws-cite-id{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .ws-empty-side{color:var(--ink-faint);font-style:italic;font-size:12px;padding:8px 0}
  .ws-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ws-actions .btn{font-size:12px;padding:6px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:500;font-family:var(--sans)}
  .ws-actions .btn:hover{background:var(--ink);color:var(--paper)}
  .ws-actions .btn-opus{color:var(--warn);border-color:var(--warn)}
  .ws-actions .btn-opus:hover{background:var(--warn);color:var(--paper)}
  .ws-actions .btn-save{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .ws-actions .btn-save:hover{background:#3a4a2e}
  .ws-actions .btn:disabled{opacity:.5;cursor:wait}
  .ws-model-tag{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
  .ws-spinner{display:none;font-size:12px;color:var(--ink-faint);font-style:italic}
  .ws-spinner.show{display:inline}
  .ws-saved-badge{font-size:11px;color:var(--accent);font-family:var(--mono);display:none}
  .ws-saved-badge.show{display:inline}

  /* 待確認區（原已剔除） */
  .rejected-section{margin-top:36px}
  .rejected-toggle{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:14px;color:var(--ink-soft);width:100%;text-align:left}
  .rejected-toggle:hover{background:var(--accent-bg);border-color:var(--accent-soft)}
  .rejected-toggle::before{content:'▸';font-size:12px;transition:transform .2s}
  .rejected-toggle.open::before{transform:rotate(90deg)}
  .rejected-list{margin-top:12px;display:none}
  .rejected-list.open{display:block}
  .rejected-card{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 14px;margin-bottom:6px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:flex-start}
  .rejected-card .title-link{font-size:13px;color:var(--ink-soft);text-decoration:none;line-height:1.4}
  .rejected-card .title-link:hover{color:var(--accent)}
  .rejected-card .meta-row{font-size:11px;color:var(--ink-faint);margin-top:4px}
  .promote-btn{font-size:11px;padding:5px 12px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;border-radius:3px;font-family:var(--sans);white-space:nowrap}
  .promote-btn:hover{background:var(--accent);color:var(--paper)}
  .promote-btn:disabled{opacity:.5;cursor:wait}

  /* Sticky bar */
  .sticky-bar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule);padding:14px 32px;display:flex;align-items:center;gap:16px;z-index:50;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
  .sticky-inner{max-width:980px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .count-display{font-family:var(--serif);font-size:16px}
  .count-display .num{font-weight:700;color:var(--accent);font-size:22px}
  .count-display .sub{color:var(--ink-faint);font-size:13px;margin-left:6px}
  .sticky-spacer{flex:1}
  .btn{font-family:var(--sans);font-size:13px;padding:8px 16px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:500}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .btn-primary:hover{background:#3a4a2e;border-color:#3a4a2e}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-gmail{color:var(--pos);border-color:var(--pos)}
  .btn-gmail:hover{background:var(--pos);color:var(--paper)}

  /* Email modal */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(31,29,24,.5);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{background:var(--paper);border-radius:8px;max-width:720px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-header{padding:18px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
  .modal-header h3{font-family:var(--serif);font-size:18px;font-weight:500;margin:0}
  .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-faint);padding:0;line-height:1}
  .modal-close:hover{color:var(--ink)}
  .modal-body{padding:20px 24px;overflow-y:auto;flex:1}
  .modal-footer{padding:14px 24px;border-top:1px solid var(--rule);display:flex;gap:10px;justify-content:flex-end;background:var(--rule-soft)}
  .modal-tabs{display:flex;border-bottom:1px solid var(--rule);margin:-20px -24px 20px}
  .modal-tabs button{background:transparent;border:none;padding:12px 20px;font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--ink-faint);border-bottom:2px solid transparent}
  .modal-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
  .modal-textarea{width:100%;min-height:360px;padding:14px;border:1px solid var(--rule);border-radius:3px;font-family:var(--mono);font-size:12px;line-height:1.7;background:var(--paper);color:var(--ink);resize:vertical;outline:none;white-space:pre;overflow-x:auto}
  .html-preview{width:100%;min-height:360px;padding:14px;border:1px solid var(--rule);border-radius:3px;background:#fff;overflow:auto}
  .recipients-list{font-size:12px;color:var(--ink-faint);margin-top:10px;font-family:var(--mono)}

  /* Loading & toast */
  .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(245,241,232,.85);display:none;align-items:center;justify-content:center;z-index:200}
  .loading-overlay.show{display:flex}
  .loading-box{background:var(--paper);border:1px solid var(--rule);padding:32px 40px;border-radius:6px;text-align:center;max-width:360px}
  .spinner{width:32px;height:32px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:var(--serif);font-size:15px;margin-bottom:6px}
  .loading-sub{font-size:12px;color:var(--ink-faint)}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:250;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.error{background:var(--neg)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);font-style:italic;font-size:14px;background:var(--paper);border:1px dashed var(--rule);border-radius:6px}

  @media(max-width:720px){
    .page{padding:20px 16px 140px}
    .summary-stats{grid-template-columns:repeat(2,1fr)}
    .fields{grid-template-columns:1fr}
    .loc-fields{grid-template-columns:1fr 1fr}
    .card{padding:16px}
    .sticky-bar{padding:12px 16px}
    .ws-body{grid-template-columns:1fr}
  }
</style>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-api.js"></script>
</head>
<body>

<div class="page">
  <header>
    <div class="eyebrow">農業綠能輿情監測 · 每日確認</div>
    <h1>候選新聞</h1>
    <div class="subhead">勾選要納入今日輿情列表的新聞，系統每天下午 15:00 自動執行。</div>

    <div class="status-bar">
      <div class="status-info">
        <span class="status-item"><span class="status-dot" id="status-dot"></span>資料更新時間：<strong id="last-run-at">2026/08/14 07:00:15</strong></span>
        <span class="status-item">候選 <strong id="cand-count">0</strong> 則 · 待確認 <strong id="rej-count">0</strong> 則</span>
      </div>
      <div class="fetch-group">
        <button class="refresh-btn" id="btn-manual-refresh">抓取新聞（預設：前24小時）</button>
        <button class="custom-time-toggle" id="btn-toggle-custom">自訂時間 ▾</button>
      </div>
    </div>
    <div class="custom-time-row" id="custom-time-row">
      <label>從</label>
      <input type="datetime-local" id="from-time">
      <label>到</label>
      <input type="datetime-local" id="to-time">
      <button class="refresh-btn" id="btn-custom-fetch">抓取</button>
    </div>

    <div class="summary-stats">

  <!-- ＋ 新增新聞 Modal -->

          <div style="font-size:12px;color:var(--ink-faint);line-height:1.6">系統會嘗試抓取內文並讓 AI 分析。部分網站擋爬蟲時會失敗，請改用右邊分頁手動貼上。</div>

        <div id="addtab-manual" class="addtab-pane" style="display:none">
          <label style="font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px">新聞標題</label>
          <input type="text" id="add-title" placeholder="新聞標題" style="width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:3px;font-family:inherit;font-size:14px;background:var(--paper);outline:none;margin-bottom:10px">

          <textarea id="add-body" placeholder="貼新聞內文" style="width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;font-family:inherit;font-size:13px;line-height:1.6;background:var(--paper);outline:none;margin-bottom:10px;resize:vertical"></textarea>

          <input type="text" id="add-source" placeholder="如：經濟日報" style="width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:3px;font-family:inherit;font-size:14px;background:var(--paper);outline:none">

  </div>

<script>
const GREEN_TYPES = window.MOCK_DATA.GREEN_TYPES;
const INITIATORS  = window.MOCK_DATA.INITIATORS;
const TAGS        = window.MOCK_DATA.TAGS;

const INITIAL_CANDIDATES = window.MOCK_DATA.candidates;
const INITIAL_REJECTED   = window.MOCK_DATA.rejected;
const PASSWORD  = window.MOCK_DATA.password;

let state    = INITIAL_CANDIDATES.map(c => ({ ...c, selectedTags: c.tags || [] }));
let rejected = [...INITIAL_REJECTED];
let currentFilter = 'all';
let emailData = { plain: '', html: '' };
let currentEmailTab = 'html-preview';

const list    = document.getElementById('card-list');
const rejList = document.getElementById('rejected-list');

// ── 07 自訂時間 ──────────────────────────────────────────────
document.getElementById('btn-toggle-custom').addEventListener('click', () => {
  document.getElementById('custom-time-row').classList.toggle('open');
});
document.getElementById('btn-custom-fetch').addEventListener('click', () => {
  const from = document.getElementById('from-time').value;
  const to   = document.getElementById('to-time').value;
  if (!from || !to) { toast('請選擇起訖時間', true); return; }
  if (new Date(from) >= new Date(to)) { toast('起始時間需早於結束時間', true); return; }
  if (!confirm('將抓取 ' + from + ' 到 ' + to + ' 的新聞，確定？')) return;
  doFetchNews({ fromTime: new Date(from).toISOString(), toTime: new Date(to).toISOString() });
});
document.getElementById('btn-manual-refresh').addEventListener('click', () => {
  if (!confirm('將抓取前 24 小時新聞，預計 2-4 分鐘。確定？')) return;
  doFetchNews({});
});
function doFetchNews(opts) {
  showLoading('抓取新聞中', '抓取 RSS、AI 分析中…');
  document.getElementById('btn-manual-refresh').disabled = true;
  document.getElementById('btn-custom-fetch').disabled   = true;
  google.script.run
    .withSuccessHandler(result => {
      hideLoading();
      document.getElementById('btn-manual-refresh').disabled = false;
      document.getElementById('btn-custom-fetch').disabled   = false;
      if (result.success) {
        toast(result.message);
        setTimeout(() => location.reload(), 1500);
      } else {
        toast(result.message, true);
      }
    })
    .withFailureHandler(err => {
      hideLoading();
      document.getElementById('btn-manual-refresh').disabled = false;
      document.getElementById('btn-custom-fetch').disabled   = false;
      toast('失敗：' + err.message, true);
    })
    .triggerFetchNews(opts);
}

// ── Card builder ─────────────────────────────────────────────
function buildCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  if (item.checked) card.classList.add('selected');
  if (item.score === 1) card.classList.add('is-negative');
  if (item.aiSuggest === 'skip') card.classList.add('suggest-skip');
  if (item.aiSuggest === 'pending') card.classList.add('is-pending');

  const suggestBadge = ({
    attend:   '<span class="ai-suggest ai-attend">AI 建議關注</span>',
    critical: '<span class="ai-suggest ai-critical">AI 建議重點關注</span>',
    skip:     '<span class="ai-suggest ai-skip">AI 建議不關注</span>',
    pending:  '<span class="ai-suggest ai-pending">待人工分析</span>'
  })[item.aiSuggest] || '';

  const tagsHtml = TAGS.map(t => {
    const isAi  = (item.tags || []).includes(t);
    const isSel = item.selectedTags.includes(t);
    let cls = 'tag' + (isSel ? ' active' : (isAi ? ' ai-suggested' : ''));
    return `<button class="${cls}" data-tag="${t}">${t}</button>`;
  }).join('');

  const typeOpts = GREEN_TYPES.map(t =>
    `<option value="${t}"${t === item.type ? ' selected' : ''}>${t}</option>`).join('');
  const initOpts = INITIATORS.map(t =>
    `<option value="${t}"${t === item.initiator ? ' selected' : ''}>${t}</option>`).join('');

  // AI 分析按鈕（所有候選）；回應稿按鈕（負面才出現）
  const aiBtn = `<button class="card-action-btn" data-action="ai-analyze" data-id="${item.id}">AI 分析</button>`;
  const argBtn = item.score === 1
    ? `<button class="card-action-btn neg" data-action="draft-response" data-id="${item.id}">→ 起草回應稿</button>`
    : '';

  card.innerHTML = `
    <div class="card-top">
      <div class="check-wrap"><input type="checkbox" class="check" data-check="${item.id}" ${item.checked ? 'checked' : ''}></div>
      <div class="card-main">
        <h2><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h2>
        <div class="meta">
          <span>${item.date || ''}</span>
          <span class="dot"></span>
          <span>${item.source || ''}</span>
          ${item.matchedKeyword ? '<span class="dot"></span><span>關鍵字：' + item.matchedKeyword + '</span>' : ''}
          ${item.url ? '<span class="dot"></span><a href="' + item.url + '" target="_blank" rel="noopener">原文 ↗</a>' : ''}
        </div>
        ${item.aiNote ? '<div class="ai-note"><span class="label">AI 摘要</span>' + escapeHtml(item.aiNote) + '</div>' : ''}
      </div>
      <div>${suggestBadge}</div>
    </div>
    <div class="fields">
      <div class="field"><label class="field-label">綠能型態</label><select data-field="type" data-id="${item.id}">${typeOpts}</select></div>
      <div class="field"><label class="field-label">議題發起者</label><select data-field="initiator" data-id="${item.id}">${initOpts}</select></div>
      <div class="field" style="grid-column:1/-1;">
        <label class="field-label">觀感分數</label>
        <div class="score-group" data-score-group="${item.id}">
          <button class="score-btn ${item.score===1?'active-1':''}" data-score="1">1 · 負面</button>
          <button class="score-btn ${item.score===2?'active-2':''}" data-score="2">2 · 中立</button>
          <button class="score-btn ${item.score===3?'active-3':''}" data-score="3">3 · 正面</button>
        </div>
      </div>
    </div>
    <div class="tags">
      <div class="tags-label">議題類別（虛線框＝AI 建議）</div>
      <div class="tag-list" data-tags-for="${item.id}">${tagsHtml}</div>
    </div>
    <div class="loc-fields">
      <input type="text" placeholder="行政區" data-field="region"   data-id="${item.id}" value="${escapeAttr(item.region   || '')}">
      <input type="text" placeholder="地點"   data-field="location" data-id="${item.id}" value="${escapeAttr(item.location || '')}">
      <input type="text" placeholder="設置場域" data-field="site"  data-id="${item.id}" value="${escapeAttr(item.site     || '')}">
      <input type="text" placeholder="（保留）" disabled style="opacity:.4;">
    </div>
    <div class="card-actions">
      ${aiBtn}
      ${argBtn}
      <label class="ref-toggle" title="勾選＝給長官參考（email 顯示黑字、不納入週/季輿情統計）">
        <input type="checkbox" class="ref-check" data-ref="${item.id}" ${item.forReference ? 'checked' : ''}>
        <span>給長官參考</span>
      </label>
    </div>
    <!-- 回應稿工作區（同頁展開） -->
    <div class="response-workspace" id="ws-${item.id}">
      <div class="ws-header">
        <div class="ws-title">
          <span>回應稿工作區</span>
          <span class="ws-badge" id="ws-badge-${item.id}">Sonnet</span>
          <span class="ws-spinner" id="ws-spinner-${item.id}">AI 生成中…</span>
        </div>
        <button class="ws-close" data-ws-close="${item.id}">×</button>
      </div>
      <div class="ws-body">
        <div class="ws-draft">
          <textarea id="ws-draft-${item.id}" placeholder="AI 回應稿草稿將顯示在此，可直接編輯…"></textarea>
        </div>
        <div class="ws-side">
          <div class="ws-side-label">質疑論點</div>
          <div class="ws-issues" id="ws-issues-${item.id}"><div class="ws-empty-side">點「起草回應稿」後顯示</div></div>
          <div class="ws-side-label" style="margin-top:10px;">援引論點</div>
          <div class="ws-citations" id="ws-cite-${item.id}"><div class="ws-empty-side">—</div></div>
        </div>
      </div>
      <div class="ws-actions">
        <button class="btn btn-opus" data-action="draft-opus" data-id="${item.id}">召喚 Opus 重寫</button>
        <button class="btn" data-action="copy-draft" data-id="${item.id}">複製</button>
        <button class="btn btn-save" data-action="save-recommended" data-id="${item.id}">存為建議回應</button>
        <span class="ws-saved-badge" id="ws-saved-${item.id}">✓ 已存</span>
      </div>
    </div>
  `;
  return card;
}

function buildRejectedCard(item) {
  const card = document.createElement('div');
  card.className = 'rejected-card';
  card.innerHTML = `
    <div>
      <a class="title-link" href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
      <div class="meta-row">${item.source || ''}${item.matchedKeyword ? ' · 觸發：' + item.matchedKeyword : ''}
        ${item.description ? '<br><span style="color:var(--ink-faint);font-size:10px;">' + escapeHtml(item.description.slice(0,100)) + '…</span>' : ''}
      </div>
    </div>
    <button class="promote-btn" data-promote-id="${item.id}">放入候選</button>
  `;
  return card;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAll() {
  list.innerHTML = '';
  if (state.length === 0) {
    list.innerHTML = '<div class="empty-state">尚無候選新聞。系統每天下午 15:00 自動執行，或按上方「抓取新聞」立即抓取。</div>';
  } else {
    state.forEach(item => {
      let show = true;
      if (currentFilter === 'attend')   show = (item.aiSuggest === 'attend' || item.aiSuggest === 'critical');
      if (currentFilter === 'negative') show = (item.score === 1);
      if (currentFilter === 'selected') show = item.checked;
      if (!show) return;
      list.appendChild(buildCard(item));
    });
  }
  rejList.innerHTML = '';
  rejected.forEach(r => rejList.appendChild(buildRejectedCard(r)));
  attachListeners();
  updateStats();
}

function attachListeners() {
  // 勾選
  document.querySelectorAll('[data-check]').forEach(el => {
    el.addEventListener('change', e => {
      const id   = parseInt(e.target.dataset.check);
      const item = state.find(i => i.id === id);
      if (!item) return;
      item.checked = e.target.checked;
      e.target.closest('.card').classList.toggle('selected', item.checked);
      updateStats();
    });
  });
  // 給長官參考
  document.querySelectorAll('[data-ref]').forEach(el => {
    el.addEventListener('change', e => {
      const id   = parseInt(e.target.dataset.ref);
      const item = state.find(i => i.id === id);
      if (item) item.forReference = e.target.checked;
    });
  });
  // 下拉欄位
  document.querySelectorAll('select[data-field]').forEach(el => {
    el.addEventListener('change', e => {
      const item = state.find(i => i.id === parseInt(e.target.dataset.id));
      if (item) item[e.target.dataset.field] = e.target.value;
    });
  });
  document.querySelectorAll('input[data-field]').forEach(el => {
    el.addEventListener('input', e => {
      const item = state.find(i => i.id === parseInt(e.target.dataset.id));
      if (item) item[e.target.dataset.field] = e.target.value;
    });
  });
  // 分數
  document.querySelectorAll('[data-score-group]').forEach(g => {
    const id   = parseInt(g.dataset.scoreGroup);
    const item = state.find(i => i.id === id);
    g.querySelectorAll('.score-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!item) return;
        item.score = parseInt(btn.dataset.score);
        renderAll();
      });
    });
  });
  // 標籤
  document.querySelectorAll('[data-tags-for]').forEach(tl => {
    const id   = parseInt(tl.dataset.tagsFor);
    const item = state.find(i => i.id === id);
    tl.querySelectorAll('.tag').forEach(t => {
      t.addEventListener('click', () => {
        if (!item) return;
        const tg  = t.dataset.tag;
        const idx = item.selectedTags.indexOf(tg);
        if (idx >= 0) item.selectedTags.splice(idx, 1);
        else item.selectedTags.push(tg);
        t.classList.toggle('active');
      });
    });
  });
  // 02：AI 分析按鈕
  document.querySelectorAll('[data-action="ai-analyze"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id   = parseInt(btn.dataset.id);
      const item = state.find(i => i.id === id);
      if (!item) return;
      btn.disabled = true;
      btn.textContent = '分析中…';
      google.script.run
        .withSuccessHandler(result => {
          btn.disabled = false;
          btn.textContent = 'AI 分析';
          if (result.success) {
            Object.assign(item, result.result);
            item.selectedTags = result.result.tags || [];
            renderAll();
            toast('AI 分析完成');
          } else {
            toast(result.message || '分析失敗', true);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = 'AI 分析';
          toast('失敗：' + err.message, true);
        })
        .triggerAnalyzeSingle(id);
    });
  });
  // 04：起草回應稿按鈕
  document.querySelectorAll('[data-action="draft-response"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id   = parseInt(btn.dataset.id);
      const item = state.find(i => i.id === id);
      if (!item) return;
      openWorkspace(item, false);
    });
  });
  // 04：召喚 Opus
  document.querySelectorAll('[data-action="draft-opus"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id   = parseInt(btn.dataset.id);
      const item = state.find(i => i.id === id);
      if (!item) return;
      if (!confirm('Opus 品質更高，費用約 Sonnet 5 倍。確定召喚 Opus？')) return;
      openWorkspace(item, true);
    });
  });
  // 複製草稿
  document.querySelectorAll('[data-action="copy-draft"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id  = parseInt(btn.dataset.id);
      const txt = document.getElementById('ws-draft-' + id).value;
      if (!txt) { toast('稿件為空', true); return; }
      try { await navigator.clipboard.writeText(txt); toast('已複製'); }
      catch { toast('複製失敗，請手動選取', true); }
    });
  });
  // 存為建議回應
  document.querySelectorAll('[data-action="save-recommended"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id   = parseInt(btn.dataset.id);
      const item = state.find(i => i.id === id);
      if (!item) return;
      const txt = document.getElementById('ws-draft-' + id).value;
      if (!txt) { toast('稿件為空，請先產生回應稿', true); return; }
      btn.disabled = true;
      btn.textContent = '存入中…';
      google.script.run
        .withSuccessHandler(result => {
          btn.disabled = false;
          btn.textContent = '存為建議回應';
          if (result.success) {
            document.getElementById('ws-saved-' + id).classList.add('show');
            toast('已存為建議回應，並寫入知識庫_待整合');
          } else {
            toast(result.message || '儲存失敗', true);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = '存為建議回應';
          toast('失敗：' + err.message, true);
        })
        .triggerSaveAsRecommended({ newsTitle: item.title, newsBody: item.description || '', draftText: txt });
    });
  });
  // 關閉工作區
  document.querySelectorAll('[data-ws-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.wsClose);
      const ws = document.getElementById('ws-' + id);
      if (ws) ws.classList.remove('open');
    });
  });
  // 02：放入候選
  document.querySelectorAll('[data-promote-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.promoteId);
      btn.disabled = true;
      btn.textContent = '移入中…';
      google.script.run
        .withSuccessHandler(result => {
          if (result.success) {
            toast('已放入候選，可點「AI 分析」補跑');
            rejected = rejected.filter(r => r.id !== id);
            // 重新取候選資料
            google.script.run
              .withSuccessHandler(newCands => {
                state = newCands.map(c => ({ ...c, selectedTags: c.tags || [] }));
                renderAll();
              }).getCandidatesData();
          } else {
            btn.disabled = false;
            btn.textContent = '放入候選';
            toast(result.message || '失敗', true);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = '放入候選';
          toast('失敗：' + err.message, true);
        })
        .triggerPromoteToCandidate(id);
    });
  });
}

// 04：展開工作區並呼叫 AI 起草
function openWorkspace(item, useOpus) {
  const ws = document.getElementById('ws-' + item.id);
  if (!ws) return;
  ws.classList.add('open');
  const spinner = document.getElementById('ws-spinner-' + item.id);
  const badge   = document.getElementById('ws-badge-' + item.id);
  const draftTA = document.getElementById('ws-draft-' + item.id);
  const issuesEl = document.getElementById('ws-issues-' + item.id);
  const citeEl   = document.getElementById('ws-cite-' + item.id);

  spinner.classList.add('show');
  draftTA.classList.add('loading');
  draftTA.value = '生成中…';
  badge.textContent = useOpus ? 'Opus' : 'Sonnet';

  google.script.run
    .withSuccessHandler(result => {
      spinner.classList.remove('show');
      draftTA.classList.remove('loading');
      if (result.success) {
        draftTA.value = result.draft || '';
        issuesEl.innerHTML = (result.issues || []).map(i => `<div class="ws-issue">${escapeHtml(i)}</div>`).join('') || '<div class="ws-empty-side">—</div>';
        citeEl.innerHTML = (result.citations || []).map(c => {
          if (c && typeof c === 'object') {
            return `<div class="ws-cite">${escapeHtml(c.title || '')}<span class="ws-cite-id">（${escapeHtml(c.id || '')}）</span></div>`;
          }
          return `<div class="ws-cite">${escapeHtml(c)}</div>`;
        }).join('') || '<div class="ws-empty-side">—</div>';
        badge.textContent = result.model || (useOpus ? 'Opus' : 'Sonnet');
      } else {
        draftTA.value = '生成失敗：' + (result.message || '未知錯誤');
        toast('回應稿生成失敗', true);
      }
    })
    .withFailureHandler(err => {
      spinner.classList.remove('show');
      draftTA.classList.remove('loading');
      draftTA.value = '失敗：' + err.message;
      toast('失敗：' + err.message, true);
    })
    .triggerDraftResponse({ newsTitle: item.title, newsBody: item.description || '', useOpus: useOpus });
}

function updateStats() {
  const total   = state.length;
  const attend  = state.filter(i => i.aiSuggest === 'attend' || i.aiSuggest === 'critical').length;
  const neg     = state.filter(i => i.score === 1).length;
  const pos     = state.filter(i => i.score === 3).length;
  const rej     = rejected.length;
  const checked = state.filter(i => i.checked).length;
  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-attend').textContent  = attend;
  document.getElementById('stat-neg').textContent     = neg;
  document.getElementById('stat-pos').textContent     = pos;
  document.getElementById('stat-rej').textContent     = rej;
  document.getElementById('cand-count').textContent   = total;
  document.getElementById('rej-count').textContent    = rej;
  document.getElementById('rej-toggle-count').textContent = rej;
  document.getElementById('count-num').textContent    = checked;
  document.getElementById('count-total').textContent  = total;
  document.getElementById('btn-save-checks').disabled    = total === 0;
  document.getElementById('btn-generate-email').disabled = checked === 0;
  document.getElementById('btn-send-gmail').disabled     = checked === 0;
  document.getElementById('btn-promote').disabled        = checked === 0;
}

// 篩選 pills
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentFilter = p.dataset.filter;
    renderAll();
  });
});
document.getElementById('btn-select-all').addEventListener('click', () => {
  state.forEach(i => { if (i.aiSuggest === 'attend' || i.aiSuggest === 'critical') i.checked = true; });
  renderAll();
});
document.getElementById('btn-clear').addEventListener('click', () => {
  state.forEach(i => i.checked = false);
  renderAll();
});
document.getElementById('rejected-toggle').addEventListener('click', () => {
  document.getElementById('rejected-toggle').classList.toggle('open');
  document.getElementById('rejected-list').classList.toggle('open');
});

// 儲存勾選
document.getElementById('btn-save-checks').addEventListener('click', () => {
  showLoading('儲存中', '');
  google.script.run
    .withSuccessHandler(() => { hideLoading(); toast('已儲存勾選'); })
    .withFailureHandler(err => { hideLoading(); toast('失敗：' + err.message, true); })
    .saveCheckedState(state.map(i => ({ id: i.id, checked: i.checked })));
});

// 03-B：Gmail 寄送
document.getElementById('btn-send-gmail').addEventListener('click', () => {
  if (!confirm('將用 Gmail 寄送 HTML 彙整版給設定_寄送名單中的啟用收件人，確定？')) return;
  showLoading('寄信中', '透過 GmailApp 寄送…');
  google.script.run
    .withSuccessHandler(result => {
      hideLoading();
      if (result.success) {
        toast('已寄出 · 收件人 ' + result.to + ' / 副本 ' + result.cc + ' / 密件 ' + result.bcc);
      } else {
        toast(result.message || '寄信失敗', true);
      }
    })
    .withFailureHandler(err => { hideLoading(); toast('失敗：' + err.message, true); })
    .triggerSendByGmail();

// 03-C：HTML 預覽複製
document.getElementById('btn-generate-email').addEventListener('click', () => {
  showLoading('產生彙整版中', '儲存目前編輯…');
  google.script.run
    .withSuccessHandler(() => {
      google.script.run
        .withSuccessHandler(result => {
          hideLoading();
          emailData = result;
          showEmailModal();
        })
        .withFailureHandler(err => { hideLoading(); toast('產生失敗：' + err.message, true); })
        .getSummaryEmail();
    })
    .withFailureHandler(err => { hideLoading(); toast('儲存失敗：' + err.message, true); })
    .saveCheckedState(state.map(i => ({ id: i.id, checked: i.checked })));
});

function showEmailModal() {
  document.getElementById('html-preview-area').innerHTML = emailData.html || '';
  document.getElementById('plain-content').value = emailData.plain || '';
  document.getElementById('recipients-display').textContent = '';
  document.querySelectorAll('.modal-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'html-preview'));
  document.getElementById('html-preview-area').style.display = 'block';
  document.getElementById('plain-content').style.display = 'none';
  document.getElementById('email-modal').classList.add('show');
}

document.querySelectorAll('.modal-tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.modal-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const isHtml = b.dataset.tab === 'html-preview';
    document.getElementById('html-preview-area').style.display = isHtml ? 'block' : 'none';
    document.getElementById('plain-content').style.display     = isHtml ? 'none'  : 'block';
    currentEmailTab = b.dataset.tab;
  });
});

document.getElementById('email-modal-close').addEventListener('click',   () => document.getElementById('email-modal').classList.remove('show'));
document.getElementById('email-modal-close-2').addEventListener('click', () => document.getElementById('email-modal').classList.remove('show'));

document.getElementById('btn-copy-html').addEventListener('click', async () => {
  if (currentEmailTab === 'html-preview') {
    // 複製渲染好的 HTML 內容（供貼入 Outlook，保留格式）
    const area = document.getElementById('html-preview-area');
    try {
      const blob = new Blob([emailData.html], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      await navigator.clipboard.write([item]);
      toast('已複製 HTML（可直接貼入 Outlook）');
    } catch {
      // 備援：選取
      const range = document.createRange();
      range.selectNodeContents(area);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      toast('已複製（備援模式）');
    }
  } else {
    const txt = document.getElementById('plain-content').value;
    try { await navigator.clipboard.writeText(txt); toast('已複製純文字版'); }
    catch { toast('複製失敗', true); }
  }
});

// 晉升
document.getElementById('btn-promote').addEventListener('click', () => {
  const n = state.filter(i => i.checked).length;
  if (!confirm('將晉升 ' + n + ' 則新聞到輿情主表，確定？')) return;
  showLoading('晉升中', '寫入輿情主表…');
  google.script.run
    .withSuccessHandler(result => {
      hideLoading();
      toast('已晉升 ' + result.count + ' 則到輿情主表');
      state.forEach(i => i.checked = false);
      renderAll();
    })
    .withFailureHandler(err => { hideLoading(); toast('晉升失敗：' + err.message, true); })
    .saveAndPromote(state.map(i => ({
      id: i.id, checked: i.checked,
      type: i.type, initiator: i.initiator, score: i.score,
      tags: i.selectedTags, region: i.region || '', location: i.location || '',
      forReference: i.forReference === true
    })));
});

function showLoading(text, sub) {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading-sub').textContent  = sub || '';
  document.getElementById('loading').classList.add('show');
}
function hideLoading() { document.getElementById('loading').classList.remove('show'); }
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function checkFreshness() {
  const txt = document.getElementById('last-run-at').textContent.trim();
  if (!txt || txt === '尚未執行') { document.getElementById('status-dot').classList.add('stale'); return; }
  try {
    const m = txt.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
    if (m) {
      const lastRun   = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
      const hoursAgo  = (new Date() - lastRun) / 1000 / 3600;
      if (hoursAgo > 26) document.getElementById('status-dot').classList.add('stale');
    }
  } catch(e) {}
}

// ── ＋ 新增新聞 modal ──────────────────────────────────────────
document.getElementById('btn-add-news').addEventListener('click', () => {
  document.getElementById('add-news-modal').classList.add('show');
});
document.getElementById('add-news-close').addEventListener('click', () => {
  document.getElementById('add-news-modal').classList.remove('show');
});
document.getElementById('add-news-cancel').addEventListener('click', () => {
  document.getElementById('add-news-modal').classList.remove('show');
});
document.querySelectorAll('[data-addtab]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-addtab]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.addtab-pane').forEach(p => p.style.display = 'none');
    document.getElementById('addtab-' + b.dataset.addtab).style.display = 'block';
  });
});
document.getElementById('add-news-submit').addEventListener('click', () => {
  const activeTab = document.querySelector('[data-addtab].active').dataset.addtab;
  let payload = {};
  if (activeTab === 'url') {
    const url = document.getElementById('add-url').value.trim();
    if (!url) { toast('請貼上連結', true); return; }
    payload = { url };
  } else {
    const title = document.getElementById('add-title').value.trim();
    const body  = document.getElementById('add-body').value.trim();
    if (!title) { toast('請填新聞標題', true); return; }
    const dateStr = document.getElementById('add-date').value;
    const source  = document.getElementById('add-source').value.trim();
    payload = { title, body, source, pubDate: dateStr ? new Date(dateStr).toISOString() : '' };
  }
  const btn = document.getElementById('add-news-submit');
  btn.disabled = true; btn.textContent = '新增中（含 AI 分析）…';
  showLoading('新增新聞中', activeTab === 'url' ? '抓取內文＋AI 分析…' : 'AI 分析中…');
  google.script.run
    .withSuccessHandler(r => {
      hideLoading();
      btn.disabled = false; btn.textContent = '新增（自動跑 AI 分析）';
      if (r.success) {
        document.getElementById('add-news-modal').classList.remove('show');
        // 清空欄位
        document.getElementById('add-url').value = '';
        document.getElementById('add-title').value = '';
        document.getElementById('add-body').value = '';
        document.getElementById('add-date').value = '';
        document.getElementById('add-source').value = '';
        toast('已新增：' + (r.title || ''));
        // 重新載入候選清單
        google.script.run
          .withSuccessHandler(cands => {
            state = cands.map(c => ({ ...c, selectedTags: c.tags || [] }));
            renderAll();
          }).getCandidatesData();
      } else {
        toast(r.message || '新增失敗', true);
      }
    })
    .withFailureHandler(err => {
      hideLoading();
      btn.disabled = false; btn.textContent = '新增（自動跑 AI 分析）';
      toast('失敗：' + err.message, true);
    })
    .triggerAddManualNews(payload);
});

renderAll();
checkFreshness();
</script>
